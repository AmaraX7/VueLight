<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VueLight</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <h1>VueLight</h1>
  <input id="flight" placeholder="Flight Number"><br>
  <button onclick="saveInfo()">Send</button>

  <h2>Your Flight Info</h2>
  <div id="infoDisplay"></div>
  <div id="extraInfo"></div>

  <script>
    async function saveInfo() {
      const flight = document.getElementById("flight").value;
      try {
        const response = await fetch(`/check-flight/${flight}`);
        const data = await response.json();
        if (data.error) {
          alert(data.error);
          return;
        }

        const info = {
          flight: data.flight_number,
          gate: data.departure_gate || "Desconocida",
          status: data.status || "Desconocido",
          delay: data.delay || 0,
        };

        localStorage.setItem("flightInfo", JSON.stringify(info));
        displayInfo();
      } catch (error) {
        console.error("Error al consultar el vuelo:", error);
        alert("Error al obtener la información del vuelo.");
      }
    }

    function displayInfo() {
      const stored = localStorage.getItem("flightInfo");
      if (!stored) return;

      const data = JSON.parse(stored);
      document.getElementById("infoDisplay").innerText =
        `${data.flight} | Gate ${data.gate} | ${data.status}`;
      document.getElementById("extraInfo").innerText =
        `Delay: ${data.delay} min`;
    }

    window.onload = displayInfo;
  </script>
</body>
</html>
